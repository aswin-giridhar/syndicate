      - generic [ref=e36]:
        - heading "Why a price and not a score" [level=2] [ref=e37]
        - generic [ref=e38]: Every existing agent-trust design — the ERC-8004 Reputation Registry, gauntlet scores, soulbound badges — produces a claim, and claims are cheap to manufacture. The first empirical study of ERC-8004 (arXiv:2606.26028) found 73.5% / 59.2% / 90.6% of reviewers on Ethereum / BSC / Base were coordinated Sybils, and that reputation there "can be manipulated at minimal cost". Capital at risk has never been cheap to fake. Here, loss experience can only be written by a receipt carrying the agent's own runtime signature, so a record cannot be invented in either direction — and red-teaming stops being an altruistic public good, because it is simply what underwriters do to protect their own money.
